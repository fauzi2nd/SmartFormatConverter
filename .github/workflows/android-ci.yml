name: Android CI Build & Test

on:
  push:
    branches: [ "master", "fix/*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android App (Self-Hosted Runner)
    runs-on: self-hosted
    env:
      ANDROID_HOME: C:\Users\space\AppData\Local\Android\Sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          clean: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        shell: powershell
        run: |
          # Java .properties syntax requires an escaped Windows drive colon.
          $sdk = $env:ANDROID_HOME.Replace('\', '/').Replace(':', '\:')
          Set-Content -Path local.properties -Value "sdk.dir=$sdk" -Encoding ascii -NoNewline
          Write-Host "SDK property: $(Get-Content local.properties)"

      - name: Build Debug APK
        run: gradlew.bat assembleDebug --stacktrace
        shell: cmd

      - name: Run Unit Tests
        run: gradlew.bat testDebugUnitTest --stacktrace
        shell: cmd

      - name: Run Android Lint
        # Self-hosted runners retain Gradle outputs between jobs. Reanalyze
        # rather than reusing a stale lint report for generated local.properties.
        run: gradlew.bat lintDebug --rerun-tasks --no-configuration-cache --stacktrace
        shell: cmd

      - name: Upload Test Results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/
