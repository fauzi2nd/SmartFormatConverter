name: Android CI Build & Test

on:
  push:
    branches: [ "master", "fix/*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android App (Self-Hosted Runner)
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APK
        run: gradlew.bat assembleDebug --stacktrace
        shell: cmd

      - name: Run Unit Tests
        run: gradlew.bat testDebugUnitTest --stacktrace
        shell: cmd

      - name: Run Android Lint
        run: gradlew.bat lintDebug --stacktrace
        shell: cmd

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/
