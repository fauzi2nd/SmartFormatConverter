name: Android CI Build & Test

on:
  push:
    branches: [ "master", "fix/*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App (Self-Hosted Runner)
    runs-on: self-hosted
    env:
      ANDROID_HOME: C:\Users\space\AppData\Local\Android\Sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          clean: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          # Gradle's own cache is retained by the self-hosted Windows runner.
          # Avoid setup-java cache upload warnings (Windows tar, storage quota).

      - name: Create local.properties
        shell: powershell
        run: |
          # Java .properties syntax requires an escaped Windows drive colon.
          $sdk = $env:ANDROID_HOME.Replace('\', '/').Replace(':', '\:')
          Set-Content -Path local.properties -Value "sdk.dir=$sdk" -Encoding ascii -NoNewline
          Write-Host "SDK property: $(Get-Content local.properties)"

      - name: Build Debug APK
        run: gradlew.bat assembleDebug --warning-mode summary --stacktrace
        shell: cmd

      - name: Run Unit Tests
        run: gradlew.bat testDebugUnitTest --warning-mode summary --stacktrace
        shell: cmd

      - name: Run Android Lint (Debug)
        # Self-hosted runners retain Gradle outputs between jobs. Reanalyze
        # rather than reusing a stale lint report for generated local.properties.
        run: gradlew.bat lintDebug --rerun-tasks --no-configuration-cache --warning-mode summary --stacktrace
        shell: cmd

      - name: Build Release AAB
        run: gradlew.bat bundleRelease --warning-mode summary --stacktrace
        shell: cmd

      - name: Run Android Lint (Release)
        run: gradlew.bat lintRelease --rerun-tasks --no-configuration-cache --warning-mode summary --stacktrace
        shell: cmd

      - name: Verify Native ELF and 16 KB Page-Size Compliance
        if: success()
        shell: powershell
        run: |
          Write-Host "=== Technical Verification: Inspecting Release AAB for Native ELF Binaries ==="
          $aabPath = "app/build/outputs/bundle/release/app-release.aab"
          if (-not (Test-Path $aabPath)) {
            Write-Error "Release AAB not found at $aabPath"
            exit 1
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $aabZip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $aabPath).Path)
          $soEntries = $aabZip.Entries | Where-Object { $_.FullName -like "*.so" }
          $aabZip.Dispose()

          Write-Host "Native .so shared libraries found in Release AAB: $($soEntries.Count)"
          if ($soEntries.Count -gt 0) {
            $soEntries | ForEach-Object { Write-Host " - $($_.FullName)" }
            Write-Error "Found $($soEntries.Count) native shared libraries in release AAB. Pure Kotlin migration requires 0 .so files."
            exit 1
          } else {
            Write-Host "SUCCESS: 0 native .so shared libraries found in release AAB. The app is 100% Pure Kotlin bytecode and inherently 16 KB page-size compliant on Android 15+."
          }

      - name: Print Lint Diagnostics on Failure
        if: failure()
        shell: powershell
        run: |
          # Self-hosted runner retains reports on disk. Print diagnostics in
          # the GitHub Actions log without artifact-storage quota failures.
          $report = 'app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt'
          if (Test-Path $report) {
            Write-Host '===== FULL ANDROID LINT REPORT ====='
            Get-Content $report
          } else {
            Write-Host 'No lint text report found (failure may be from build or unit tests).'
          }
