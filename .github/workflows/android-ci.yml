name: Android CI Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# PR code is untrusted; do not expose write-scoped tokens to build jobs.
permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Do not execute untrusted PR code on a persistent self-hosted runner.
    # Persistent self-hosted Windows runner executes only trusted master refs.
    # Untrusted PRs must stay on isolated GitHub-hosted runner infrastructure.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    name: Build & Test Android App (Trusted Windows Runner)
    runs-on: self-hosted
    # Only trusted master builds can publish the debug release.
    permissions:
      contents: write
    timeout-minutes: 90
    env:
      ANDROID_HOME: C:\Users\space\AppData\Local\Android\Sdk
      # Git for Windows otherwise fails to delete deeply nested Kotlin class
      # files during actions/checkout clean. Scope the setting to this job.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          # Gradle's own cache is retained by the self-hosted Windows runner.
          # Avoid setup-java cache upload warnings (Windows tar, storage quota).

      - name: Verify active JDK and clear stale Gradle daemons
        shell: powershell
        run: |
          $jlink = Join-Path $env:JAVA_HOME 'bin/jlink.exe'
          if (-not (Test-Path $jlink)) { throw "JDK jlink.exe not found at $jlink" }
          Write-Host "Using JDK: $env:JAVA_HOME"
          & .\gradlew.bat --stop

      - name: Create local.properties
        shell: powershell
        run: |
          # Java .properties syntax requires an escaped Windows drive colon.
          $sdk = $env:ANDROID_HOME.Replace('\', '/').Replace(':', '\:')
          Set-Content -Path local.properties -Value "sdk.dir=$sdk" -Encoding ascii -NoNewline
          Write-Host "SDK property: $(Get-Content local.properties)"

      - name: Build Debug APK
        run: gradlew.bat assembleDebug --no-configuration-cache --warning-mode all --stacktrace
        shell: cmd

      # APK remains on the trusted self-hosted runner. GitHub artifact uploads
      # are disabled while the account's Actions storage quota is exhausted.

      - name: Run Unit Tests
        run: gradlew.bat testDebugUnitTest --no-configuration-cache --warning-mode all --stacktrace
        shell: cmd

      - name: Compile On-Device Smoke Tests
        # Device execution is a separate release gate. This verifies that
        # AndroidJUnit4/Media3 test sources compile on every trusted push.
        run: gradlew.bat assembleDebugAndroidTest --no-configuration-cache --warning-mode all --stacktrace
        shell: cmd

      - name: Run Android Lint (Debug)
        # Self-hosted runners retain Gradle outputs between jobs. Reanalyze
        # rather than reusing a stale lint report for generated local.properties.
        run: gradlew.bat lintDebug --rerun-tasks --no-configuration-cache --warning-mode all --stacktrace
        shell: cmd

      - name: Build Release AAB
        run: gradlew.bat bundleRelease --no-configuration-cache --warning-mode all --stacktrace
        shell: cmd

      - name: Run Android Lint (Release)
        run: gradlew.bat lintRelease --rerun-tasks --no-configuration-cache --warning-mode all --stacktrace
        shell: cmd

      - name: Verify Native ELF and 16 KB Page-Size Compliance
        if: success()
        run: |
          python -c "
          import zipfile, struct, sys, os

          aab_path = 'app/build/outputs/bundle/release/app-release.aab'
          if not os.path.exists(aab_path):
              print(f'ERROR: Release bundle {aab_path} not found!')
              sys.exit(1)

          print(f'=== Verifying 16 KB ELF Page-Size Alignment in {aab_path} ===')
          failed = False
          so_count = 0

          with zipfile.ZipFile(aab_path) as z:
              for name in z.namelist():
                  if name.endswith('.so'):
                      so_count += 1
                      if 'arm64-v8a' in name or 'x86_64' in name:
                          data = z.read(name)
                          if data[:4] == b'\x7fELF':
                              e_phoff = struct.unpack('<Q', data[32:40])[0]
                              e_phentsize = struct.unpack('<H', data[54:56])[0]
                              e_phnum = struct.unpack('<H', data[56:58])[0]
                              for i in range(e_phnum):
                                  ph = data[e_phoff + i * e_phentsize : e_phoff + (i + 1) * e_phentsize]
                                  p_type = struct.unpack('<I', ph[:4])[0]
                                  if p_type == 1: # PT_LOAD
                                      p_align = struct.unpack('<Q', ph[48:56])[0]
                                      if p_align < 16384:
                                          print(f'FAIL: {name} PT_LOAD segment alignment is {p_align} (< 16384 bytes)')
                                          failed = True
                                      else:
                                          print(f'PASS: {name} PT_LOAD alignment = {p_align} (>= 16 KB compliant)')

          print(f'Total .so libraries inspected: {so_count}')
          if failed:
              print('ERROR: Found native shared libraries that are NOT 16 KB aligned!')
              sys.exit(1)
          print('SUCCESS: All 64-bit native libraries are 100% compliant with Android 15+ 16 KB page-size.')
          "

      - name: Record tested APK version and SHA-256
        id: apk_identity
        if: success() && github.ref == 'refs/heads/master'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $apkPath = 'app/build/outputs/apk/debug/app-debug.apk'
          if (-not (Test-Path $apkPath)) { throw "APK does not exist: $apkPath" }
          $hash = (Get-FileHash -Path $apkPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $versionName = "1.0.$env:GITHUB_RUN_NUMBER-debug.$shortSha"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha256=$hash" -Encoding ascii
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version_name=$versionName" -Encoding ascii
          Write-Host "APK versionName: $versionName"
          Write-Host "APK versionCode: $env:GITHUB_RUN_NUMBER"
          Write-Host "Validated commit: $env:GITHUB_SHA"
          Write-Host "APK SHA-256: $hash"

      - name: Publish installable Debug APK to GitHub Releases
        if: success() && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: debug-latest
          name: Smart Format Converter — Debug ${{ steps.apk_identity.outputs.version_name }}
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            Debug APK intended for manual testing, not a Play Store release.
            Version: ${{ steps.apk_identity.outputs.version_name }}
            Version code: ${{ github.run_number }}
            Validated source commit: ${{ github.sha }}
            Build run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            APK SHA-256: ${{ steps.apk_identity.outputs.sha256 }}

            Download app-debug.apk under Assets. The debug-latest tag is
            updated only after the validated APK has been published.

      # The release action replaces existing assets but does not move the
      # existing Git ref. Move this deliberately mutable debug-only tag once
      # its freshly uploaded APK and source identity have been verified.
      - name: Point debug-latest tag to validated source commit
        if: success() && github.ref == 'refs/heads/master'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_APK_SHA256: ${{ steps.apk_identity.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $apiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $release = Invoke-RestMethod -Uri "$apiRoot/releases/tags/debug-latest" -Headers $headers -Method Get
          if (-not $release.body.Contains($env:GITHUB_SHA)) {
            throw 'Release notes do not identify the current validated commit.'
          }
          $assets = @($release.assets | Where-Object { $_.name -eq 'app-debug.apk' })
          if ($assets.Count -ne 1 -or $assets[0].size -le 0) {
            throw 'The rolling release does not contain one non-empty app-debug.apk.'
          }
          $expectedDigest = "sha256:$env:EXPECTED_APK_SHA256"
          if ($assets[0].digest -and $assets[0].digest -ne $expectedDigest) {
            throw "Release asset digest differs from tested APK: $($assets[0].digest)"
          }
          $payload = @{ sha = $env:GITHUB_SHA; force = $true } | ConvertTo-Json -Compress
          $tag = Invoke-RestMethod -Method Patch -Uri "$apiRoot/git/refs/tags/debug-latest" -Headers $headers -ContentType 'application/json' -Body $payload
          if ($tag.object.sha -ne $env:GITHUB_SHA) {
            throw "debug-latest tag did not move to $env:GITHUB_SHA"
          }
          Write-Host "Published APK verified; debug-latest now points to $env:GITHUB_SHA"

      - name: Print Lint Diagnostics on Failure
        if: failure()
        shell: powershell
        run: |
          # Self-hosted runner retains reports on disk. Print diagnostics in
          # the GitHub Actions log without artifact-storage quota failures.
          $report = 'app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt'
          if (Test-Path $report) {
            Write-Host '===== FULL ANDROID LINT REPORT ====='
            Get-Content $report
          } else {
            Write-Host 'No lint text report found (failure may be from build or unit tests).'
          }

  pull_request_validation:
    name: Validate untrusted PR on an ephemeral GitHub-hosted runner
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "platform-tools"

      - name: Build, unit test and lint PR
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest assembleDebugAndroidTest lintDebug --no-daemon --stacktrace
